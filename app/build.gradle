plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fieldmap'
    compileSdk 34

    defaultConfig {
        applicationId 'app.fieldmap'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "0.3." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // The real signing key lives in the repository's private GitHub secrets and is handed to the
    // build through these variables. Until those secrets exist, the old key in this folder is used.
    def privateKey = System.getenv("FM_KEYSTORE")
    signingConfigs {
        fieldmap {
            if (privateKey) {
                storeFile file(privateKey)
                storePassword System.getenv("FM_STORE_PASS")
                keyAlias 'fieldmap'
                keyPassword System.getenv("FM_STORE_PASS")
            } else {
                storeFile file('fieldmap.jks')
                storePassword 'fieldmap'
                keyAlias 'fieldmap'
                keyPassword 'fieldmap'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fieldmap
        }
        debug {
            signingConfig signingConfigs.fieldmap
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
