name: Build APK

on:
  push:
    branches: [ main, test ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests
        run: |
          set -o pipefail
          mkdir -p /tmp/tb
          javac -d /tmp/tb app/src/main/java/app/fieldmap/core/*.java tests/*.java 2>&1 | tee /tmp/javac.log || {
            echo "::error title=Tests did not compile::$(head -40 /tmp/javac.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          for t in CoreTest MeshTest TacTest V3Test GmrsTest AskTest RepeaterTest; do
            java -cp /tmp/tb $t 2>&1 | tee /tmp/t.log || true
            if grep -qE "FAIL|Exception" /tmp/t.log; then
              echo "::error title=Test failed ($t)::$(grep -E 'FAIL|Exception' /tmp/t.log | head -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
              exit 1
            fi
          done

      - name: Signing key
        env:
          KS: ${{ secrets.FIELDMAP_KEYSTORE_B64 }}
          PW: ${{ secrets.FIELDMAP_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/fieldmap-private.jks"
            echo "FM_KEYSTORE=$RUNNER_TEMP/fieldmap-private.jks" >> "$GITHUB_ENV"
            echo "FM_STORE_PASS=$PW" >> "$GITHUB_ENV"
            echo "::notice title=Signing::Signed with the private key"
          else
            echo "::warning title=Signing::Private signing key is not set up yet, so this build is signed with the old public key"
          fi

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|warning: \[|What went wrong|Could not|Execution failed|> |\.java:[0-9]+|\.xml" build.log | grep -v "^> Task" | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build errors::$msg"
          aar=$(find ~/.gradle -name "osmdroid-android-6.1.20.aar" | head -1)
          if [ -n "$aar" ]; then
            mkdir -p /tmp/osm && cd /tmp/osm && unzip -o -q "$aar" classes.jar && unzip -o -q classes.jar
            api=$( (javap -cp classes.jar org.osmdroid.tileprovider.TileStates) | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=osmdroid API::$api"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FieldMap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldMap-apk
          path: FieldMap.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          # main = the build everyone downloads. The "test" branch makes a separate test build
          # that never becomes "latest", so it can be tried on one phone first.
          tag_name: ${{ github.ref_name == 'main' && 'build' || 'test' }}-${{ github.run_number }}
          name: FieldMap ${{ github.ref_name == 'main' && 'build' || 'TEST build' }} ${{ github.run_number }}
          files: FieldMap.apk
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
