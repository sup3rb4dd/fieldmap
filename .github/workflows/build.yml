name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|warning: \[|What went wrong|Could not|Execution failed|> |\.java:[0-9]+|\.xml" build.log | grep -v "^> Task" | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build errors::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FieldMap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldMap-apk
          path: FieldMap.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FieldMap build ${{ github.run_number }}
          files: FieldMap.apk
          make_latest: true
